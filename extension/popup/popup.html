<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerOS Co-Pilot</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">CareerOS</h1>
          <span class="brand-badge">Graph Co-Pilot</span>
        </div>
      </div>
      <div class="status-indicator" id="backendStatus">
        <span class="status-dot"></span>
        <span id="statusText">Online</span>
      </div>
    </header>

    <!-- Active Profile Card -->
    <section class="card profile-card">
      <div class="field-group">
        <div class="field-label-row">
          <label for="userSelect" class="field-label">Active Workspace</label>
          <span class="sync-timestamp" id="lastSyncLabel">Never synced</span>
        </div>
        <div class="select-wrapper">
          <select id="userSelect" class="custom-select">
            <option value="dev-user-0000-0000-0000-000000000001">Mohit Upraity (mohitUpraity)</option>
            <option value="user-krati-0000-0000-0000-000000000002">Krati Verma (Krati-orbit)</option>
          </select>
          <div class="select-chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="actions-group">
      <!-- Master Full Sync CTA -->
      <button id="masterSyncBtn" class="action-btn primary-action">
        <div class="action-icon master-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title">Master Full Sync</div>
          <div class="action-sub">Profile, Posts, Hackathons & Network</div>
        </div>
        <div class="action-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </button>

      <!-- Incremental Delta Sync CTA -->
      <button id="deltaSyncBtn" class="action-btn secondary-action">
        <div class="action-icon delta-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title">Sync Newly (Delta)</div>
          <div class="action-sub">Scan unindexed posts & contacts only</div>
        </div>
      </button>
    </section>

    <!-- Live Sync Progress Stepper -->
    <div id="syncProgressContainer" class="card progress-card hidden">
      <div class="progress-meta">
        <span class="progress-title" id="progressTitle">Syncing Knowledge Graph...</span>
        <span class="progress-val" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressBarFill" class="progress-fill"></div>
      </div>
      <div class="stepper-pipeline">
        <div class="stepper-step" id="step1">
          <div class="step-indicator">
            <span class="step-icon-wrapper">
              <svg class="icon-idle" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
              <svg class="icon-spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              <svg class="icon-done" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </div>
          <span class="step-label">Profile, College & Experience</span>
        </div>
        <div class="stepper-step" id="step2">
          <div class="step-indicator">
            <span class="step-icon-wrapper">
              <svg class="icon-idle" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
              <svg class="icon-spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              <svg class="icon-done" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </div>
          <span class="step-label">Posts & Hackathons (AI Extract)</span>
        </div>
        <div class="stepper-step" id="step3">
          <div class="step-indicator">
            <span class="step-icon-wrapper">
              <svg class="icon-idle" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
              <svg class="icon-spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              <svg class="icon-done" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
          </div>
          <span class="step-label">Network & Alumni Referral Paths</span>
        </div>
      </div>
    </div>

    <!-- Active Tab Context Card -->
    <section class="card context-card" id="contextCard">
      <div class="card-header-mini">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>ACTIVE TAB CONTEXT</span>
      </div>
      <div class="context-body" id="contextBody">
        <span class="context-empty">Navigate to a LinkedIn profile or job page to inspect graph intelligence.</span>
      </div>
    </section>

    <!-- Notification / Result Banner -->
    <div id="resultBanner" class="toast-banner hidden">
      <div class="toast-icon" id="toastIcon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="toast-msg" id="toastMsg"></div>
    </div>

    <!-- Footer Links -->
    <footer class="footer">
      <a href="http://localhost:8000/docs" target="_blank" class="footer-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        API Docs
      </a>
      <span class="footer-sep">/</span>
      <a href="http://localhost:8000/api/v1/profile/unified" target="_blank" class="footer-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Graph JSON
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
